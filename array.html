<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array dde Carros</title>
</head>
<body>
    <script >
        // declaração do Array carros
        const carros = ["Jetta", "Civic", "Byd"];

        document.write("<br>")

        // for na estrutura basica
        for (let i=0; i < carros.length; i++) {
            document.write (carros[i] + ", ")
        }
        document.write("<br>")

        let car;
        // loop carros simplificado
        carros.forEach((item, index) => {
            // mostra no documento
            document.write("<br>Carro: " + item + index);
        });
        document.write("<br>")

    </script>
</body>
</html>
